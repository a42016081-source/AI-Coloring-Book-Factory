{% extends "base.html" %}
{% block content %}
<h2>➕ Create New Book</h2>
<form method="post" class="card p-4">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <div class="row g-3">
    <div class="col-md-6">
      <label>Book Name</label>
      <input class="form-control" name="book_name" placeholder="My Coloring Book">
    </div>
    <div class="col-md-6">
      <label>Topic</label>
      <input class="form-control" name="topic" value="Animals" required>
    </div>
    <div class="col-md-3">
      <label>Pages</label>
      <input class="form-control" type="number" name="page_count" value="{{ settings.default_pages }}" min="1" max="200">
    </div>
    <div class="col-md-3">
      <label>Size</label>
      <select class="form-select" name="book_size">
        {% for s in ['8.5x11','8x10','A4'] %}<option>{{s}}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-3">
      <label>Age</label>
      <input class="form-control" name="target_age" value="{{ settings.target_age }}">
    </div>
    <div class="col-md-3">
      <label>Style</label>
      <input class="form-control" name="art_style" value="{{ settings.art_style }}">
    </div>
    <div class="col-12">
      <button class="btn btn-primary">🚀 Generate Book</button>
      <a class="btn btn-secondary" href="{{ url_for('dashboard_home') }}">Cancel</a>
    </div>
  </div>
</form>
{% endblock %}
