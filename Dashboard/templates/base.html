<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Coloring Book Factory{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('dashboard_home') }}">🎨 Coloring Factory</a>
    <div class="d-flex">
      <a class="btn btn-outline-light btn-sm me-2" href="{{ url_for('dashboard_home') }}">Home</a>
      <a class="btn btn-outline-light btn-sm me-2" href="{{ url_for('create_book') }}">Create</a>
      <a class="btn btn-outline-light btn-sm me-2" href="{{ url_for('books_list') }}">Books</a>
      <a class="btn btn-outline-danger btn-sm" href="{{ url_for('logout') }}">Logout</a>
    </div>
  </div>
</nav>
<div class="container py-4">
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
